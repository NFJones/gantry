[workspace]
members = [
    "crates/gantry",
    "crates/gantry-cli",
    "crates/gantry-conformance",
    "crates/gantry-core",
    "crates/gantry-host",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
gantry = { path = "crates/gantry", default-features = false }
gantry-core = { path = "crates/gantry-core" }
gantry-host = { path = "crates/gantry-host" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
