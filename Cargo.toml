[workspace]
members = [
    "crates/gantry",
    "crates/gantry-analysis",
    "crates/gantry-adapter-tokio",
    "crates/gantry-cli",
    "crates/gantry-conformance",
    "crates/gantry-core",
    "crates/gantry-frontend",
    "crates/gantry-host",
    "crates/gantry-ir",
    "crates/gantry-observe",
    "crates/gantry-runtime",
    "crates/gantry-storage-sqlite",
    "xtask",
]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[workspace.dependencies]
gantry = { path = "crates/gantry", version = "=0.1.0", default-features = false }
gantry-analysis = { path = "crates/gantry-analysis", version = "=0.1.0" }
gantry-adapter-tokio = { path = "crates/gantry-adapter-tokio", version = "=0.1.0" }
gantry-core = { path = "crates/gantry-core", version = "=0.1.0" }
gantry-frontend = { path = "crates/gantry-frontend", version = "=0.1.0" }
gantry-host = { path = "crates/gantry-host", version = "=0.1.0" }
gantry-ir = { path = "crates/gantry-ir", version = "=0.1.0" }
gantry-observe = { path = "crates/gantry-observe", version = "=0.1.0" }
gantry-runtime = { path = "crates/gantry-runtime", version = "=0.1.0" }
gantry-storage-sqlite = { path = "crates/gantry-storage-sqlite", version = "=0.1.0" }
getrandom = { version = "=0.3.4", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "load_extension"] }
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
