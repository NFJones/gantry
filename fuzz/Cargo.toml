[package]
name = "gantry-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
gantry-analysis = { path = "../crates/gantry-analysis" }
gantry-core = { path = "../crates/gantry-core" }
gantry-frontend = { path = "../crates/gantry-frontend" }
gantry-ir = { path = "../crates/gantry-ir" }
libfuzzer-sys = "=0.4.9"

[[bin]]
name = "protocol_identity"
path = "fuzz_targets/protocol_identity.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexer"
path = "fuzz_targets/lexer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "strict_json"
path = "fuzz_targets/strict_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generic_ir"
path = "fuzz_targets/generic_ir.rs"
test = false
doc = false
bench = false

[[bin]]
name = "generic_package"
path = "fuzz_targets/generic_package.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
