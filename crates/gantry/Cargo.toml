[package]
name = "gantry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Public Rust facade for the Gantry agent-control language"
documentation = "https://docs.rs/gantry"

[features]
default = ["evaluator"]
frontend = ["dep:gantry-frontend", "dep:gantry-observe"]
analyzer = ["frontend", "dep:gantry-analysis", "dep:gantry-ir"]
evaluator = ["analyzer", "dep:gantry-runtime"]
concurrent = ["evaluator", "gantry-runtime/concurrent"]
durable = ["evaluator", "gantry-runtime/durable"]

[dependencies]
gantry-analysis = { workspace = true, optional = true }
gantry-core.workspace = true
gantry-frontend = { workspace = true, optional = true }
gantry-host.workspace = true
gantry-ir = { workspace = true, optional = true }
gantry-observe = { workspace = true, optional = true }
gantry-runtime = { workspace = true, optional = true }

[lints]
workspace = true
