[package]
name = "gantry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["evaluator"]
frontend = ["dep:gantry-frontend", "dep:gantry-observe"]
analyzer = ["frontend", "dep:gantry-ir"]
evaluator = ["analyzer"]
concurrent = ["evaluator"]
durable = ["evaluator"]

[dependencies]
gantry-core.workspace = true
gantry-frontend = { workspace = true, optional = true }
gantry-host.workspace = true
gantry-ir = { workspace = true, optional = true }
gantry-observe = { workspace = true, optional = true }

[lints]
workspace = true
