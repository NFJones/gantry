[package]
name = "gantry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["evaluator"]
frontend = ["gantry/frontend"]
analyzer = ["frontend", "gantry/analyzer"]
evaluator = ["analyzer", "gantry/evaluator"]

[[bin]]
name = "gantry"
path = "src/main.rs"

[dependencies]
gantry.workspace = true
gantry-adapter-tokio.workspace = true
getrandom.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[lints]
workspace = true
